<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css"/>
    <title>World Clock - Karina Smith</title>
</head>
<body>
    <div class="container">
    <h1>
        World Clock
    </h1>
    <select>
        <option value="">Select a city...</option>
        <option value="">London</option>
        <option value="">New York</option>
        <option value="">Lima</option>
           </select>
        <div class="city">
            <div>
            <h2>Los Angeles 🏈 </h2>
            <div class="date">August 15th 2022</div>
            </div>
            <div class="time">1:48:15 <small>AM</small></div>
        </div>
        <div class="city">
            <div>
            <h2>Sydney 🌏</h2>
            <div class="date">August 15th 2022</div>
            </div>
            <div class="time">1:48:15 <small>AM</small></div>
        </div>
        <div class="city">
            <div>
                <h2>Lima 🐪</h2>
                <div class="date">August 15th 2022</div>
            </div>
            <div class="time">1:48:15 <small>AM</small></div>
        </div>
              </div>
    <footer>
     This project was coded with 💗 by <strong>Karina Smith</strong> and is open-sourced on <a href="https://github.com/KarinaV-cyber/world-clock" target="_blank">GitHub</a>.
    </footer>
    <script src="src/index.js"></script>
</body>
</html>
